# ============================================================
# Aiporto Workbench — 敏感文件访问兜底配置
# 项目位于 /www/docker/aiporto/，这是 Docker 部署目录，不属于任何网站根目录。
# 正常配置下 nginx 根本不会读这里的文件；若有人误把站点根目录指向此目录，
# 或反代规则失效，下面的规则能阻止 .env 等敏感文件被直接下载。
#
# 用法（两个站点都要加）：
#   宝塔 → 左侧「网站」→ 点站点名 →「配置文件」→ 打开后找到 `server {` 这一行，
#   把本文件全部内容粘贴到它下一行（即 server 的大括号「内部」）。
#   本文件全是 location 规则，贴到 server 外面 nginx 会启动失败。
#   保存后 nginx 会自动重载；两个站点各做一遍。
#
# 说明：正常反代配置下，请求会被 proxy_pass 转发到网关，不会读本地文件；
# 这份配置是防止「站点根目录设错」或「反代规则失效」时的兜底。
# ============================================================

# 1. 禁止访问所有点开头的文件/目录：.env、.git、.ssh 等
location ~ /\.(?!well-known) {
    deny all;
    access_log off;
    log_not_found off;
}

# 2. 禁止直接下载敏感后缀（数据库备份、密钥、脚本、编排文件）
location ~* \.(env|key|pem|p12|sql|gz|dump|bak|sh|command|yml|yaml|log)$ {
    deny all;
    access_log off;
    log_not_found off;
}

# 3. 禁止下载项目核心文件与目录（即使后缀不在上表中）
location ~ ^/(docker-compose|Dockerfile|go\.mod|go\.sum|package-lock|migrations/|cmd/|internal/|scripts/|monitoring/) {
    deny all;
    access_log off;
    log_not_found off;
}

# 4. 禁止目录列表
autoindex off;
